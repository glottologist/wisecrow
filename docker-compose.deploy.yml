services:
  postgres:
    image: postgres:15-alpine
    container_name: wisecrow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wisecrow}
      POSTGRES_USER: ${POSTGRES_USER:-wisecrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - wisecrow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wisecrow} -d ${POSTGRES_DB:-wisecrow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [wisecrow]

  wisecrow-web:
    image: wisecrow:${WISECROW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wisecrow-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      WISECROW__DB_ADDRESS: postgres:5432
      WISECROW__DB_NAME: ${POSTGRES_DB:-wisecrow}
      WISECROW__DB_USER: ${POSTGRES_USER:-wisecrow}
      WISECROW__DB_PASSWORD: ${POSTGRES_PASSWORD}
      WISECROW__TLS_CERT_PATH: /certs/fullchain.pem
      WISECROW__TLS_KEY_PATH: /certs/privkey.pem
      WISECROW__UNSPLASH_API_KEY: ${WISECROW__UNSPLASH_API_KEY:-}
      IP: 0.0.0.0
      PORT: 8443
    volumes:
      - ${WISECROW_CERT_DIR:-./certs}:/certs:ro
      # Scratch space for corpus ingest. The container's own /tmp sits on the
      # overlay filesystem, which is the 200 GB root shared with the trading
      # stack; a single OpenSubtitles archive decompresses to tens of
      # gigabytes and would crowd it. Pass `--workdir /ingest-tmp` to the
      # ingest command so downloads and decompression land on the 3.5 TB disk
      # instead.
      - ${WISECROW_INGEST_TMP:-/mnt/DATA2/ingest-tmp}:/ingest-tmp
      # Media cache (XDG_DATA_HOME, see Dockerfile). Persisted outside the
      # container because a rebuild would otherwise discard every clip and
      # re-fetch it, spending CereProc credits and image API quota to recover
      # files the deploy just deleted.
      - ${WISECROW_MEDIA_DIR:-/mnt/DATA2/wisecrow-media}:/var/lib/wisecrow
    ports:
      - "${WISECROW_WEB_BIND:-0.0.0.0}:${WISECROW_WEB_PORT:-8443}:8443"
    # Liveness, not authorization: an unauthenticated GET / is answered with the
    # rendered page under a 401, which wget reports as a failure (exit 6). Match
    # the status line instead, treating any 2xx/3xx/401 as alive and a 5xx or an
    # absent response (process down, TLS broken) as unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -S -O /dev/null https://127.0.0.1:8443/ 2>&1 | grep -qE 'HTTP/[0-9.]+ (2[0-9][0-9]|3[0-9][0-9]|401)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [wisecrow]

volumes:
  # Bind the database onto the 3.5 TB DATA2 disk rather than the default
  # named-volume location under /var/lib/docker on the 200 GB root. `type: none,
  # o: bind` binds an existing path, so Docker refuses to start Postgres if
  # /mnt/DATA2/pgdata is absent (disk unmounted) instead of silently
  # re-initialising an empty database back on root.
  wisecrow-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/DATA2/pgdata

networks:
  wisecrow:
    driver: bridge
