[package]
name = "wisecrow-dto"
version = "0.1.0"
edition = "2021"
description = "WASM-safe shared types for Wisecrow"

[dependencies]
chrono = { version = ">=0.4,<0.4.44", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
proptest = "1.5"
serde_json = "1"
