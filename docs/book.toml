[book]
authors = ["Jason Ridgway-Taylor"]
language = "en"
src = "src"
title = "WiseCrow Documentation"

# Translations are held as Gettext PO files under `po/`, not as duplicated
# Markdown trees; this preprocessor substitutes them at build time. It is a
# no-op for the source language, so the English build is unaffected. Running
# `after = ["links"]` means included files are translated along with their
# includer. See reference/translating.md for the workflow.
[preprocessor.gettext]
after = ["links"]

[output.html]
mathjax-support = true
git-repository-url = "https://github.com/glottologist/wisecrow"

[output.html.playground]
editable = true
line-numbers = true

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2
