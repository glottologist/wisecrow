---
# Sync the workspace to calypso, render the runtime .env, build the image,
# and bring the stack up.

- name: Sync repository to {{ deploy_dir }}
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ deploy_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=claude/"
      - "--exclude=codex/"
      - "--exclude=docs/book"
      - "--exclude=.direnv"
      - "--exclude=.devenv"
      - "--exclude=.devbox"
      - "--exclude=ansible/vars/secrets.yml"

- name: Render runtime .env from inventory + vault
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Build wisecrow image
  ansible.builtin.command:
    cmd: docker compose -f {{ compose_file }} build
    chdir: "{{ deploy_dir }}"
  become: true
  changed_when: true

# --- TLS: obtain and install the cert before the server binds it ----------
# calypso shares this host with the trading stack, whose Caddy owns :80/:443,
# so the cert is issued over DNS-01 (no inbound ports). IONOS has no usable DNS
# API here, so _acme-challenge is CNAME-delegated to a free deSEC zone: certbot
# runs --manual and the hook below writes the TXT via the deSEC REST API. The
# apt certbot's systemd timer renews thereafter and runs the reload deploy-hook.
- name: Assert TLS issuance inputs are present
  ansible.builtin.assert:
    that:
      - (wisecrow_tls_domain | default('')) | length > 0
      - (wisecrow_tls_email | default('')) | length > 0
      - (wisecrow_desec_domain | default('')) | length > 0
      - (wisecrow_desec_token | default('')) | length > 0
    fail_msg: >-
      wisecrow_tls_obtain_cert is true but one of wisecrow_tls_domain,
      wisecrow_tls_email, wisecrow_desec_domain or wisecrow_desec_token is
      unset (wisecrow_desec_token lives in vars/secrets.yml).
  when: wisecrow_tls_obtain_cert | bool

- name: Install certbot and curl
  ansible.builtin.apt:
    name: [certbot, curl]
    state: present
  become: true
  when: wisecrow_tls_obtain_cert | bool

- name: Write the deSEC API credentials for the challenge hook
  ansible.builtin.template:
    src: desec.env.j2
    dest: /etc/letsencrypt/desec.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  when: wisecrow_tls_obtain_cert | bool

- name: Install the deSEC DNS-01 challenge hook
  ansible.builtin.template:
    src: desec-hook.sh.j2
    dest: /etc/letsencrypt/desec-hook.sh
    owner: root
    group: root
    mode: "0700"
  become: true
  when: wisecrow_tls_obtain_cert | bool

- name: Obtain the Let's Encrypt certificate via DNS-01 (deSEC delegation)
  ansible.builtin.command:
    cmd: >-
      certbot certonly --non-interactive --agree-tos
      --manual --preferred-challenges dns
      --manual-auth-hook "/etc/letsencrypt/desec-hook.sh auth"
      --manual-cleanup-hook "/etc/letsencrypt/desec-hook.sh cleanup"
      --email {{ wisecrow_tls_email }}
      --domain {{ wisecrow_tls_domain }}
      --keep-until-expiring
    creates: "/etc/letsencrypt/live/{{ wisecrow_tls_domain }}/fullchain.pem"
  become: true
  when: wisecrow_tls_obtain_cert | bool

- name: Bootstrap the issued chain into the cert dir (renewals use the hook)
  ansible.builtin.command:
    cmd: >-
      install -D -T -o root -g {{ wisecrow_cert_uid }} -m 0644
      /etc/letsencrypt/live/{{ wisecrow_tls_domain }}/fullchain.pem
      {{ deploy_dir }}/{{ wisecrow_cert_dir }}/fullchain.pem
    creates: "{{ deploy_dir }}/{{ wisecrow_cert_dir }}/fullchain.pem"
  become: true
  when: wisecrow_tls_obtain_cert | bool

- name: Bootstrap the issued key into the cert dir (renewals use the hook)
  ansible.builtin.command:
    cmd: >-
      install -D -T -o root -g {{ wisecrow_cert_uid }} -m 0640
      /etc/letsencrypt/live/{{ wisecrow_tls_domain }}/privkey.pem
      {{ deploy_dir }}/{{ wisecrow_cert_dir }}/privkey.pem
    creates: "{{ deploy_dir }}/{{ wisecrow_cert_dir }}/privkey.pem"
  become: true
  when: wisecrow_tls_obtain_cert | bool

- name: Ensure certbot deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"
  become: true
  when: wisecrow_tls_renewal_hook | bool

- name: Install wisecrow TLS renewal deploy-hook
  ansible.builtin.template:
    src: renew-deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/wisecrow.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  when: wisecrow_tls_renewal_hook | bool

# --- Port guard: this host also runs the trading stack, so refuse to start if
# anything other than our own container already holds the web port. ---
- name: Check whether wisecrow-web is already running
  ansible.builtin.command:
    cmd: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' wisecrow-web
  become: true
  register: web_running
  changed_when: false
  failed_when: false

- name: Probe the web port for a foreign listener
  ansible.builtin.command:
    cmd: "ss -Hltn sport = :{{ wisecrow_web_port }}"
  become: true
  register: web_port_check
  changed_when: false
  when: (web_running.stdout | default('') | trim) != 'true'

- name: Fail fast if the web port is held by another process
  ansible.builtin.assert:
    that: (web_port_check.stdout | default('') | trim) | length == 0
    fail_msg: >-
      Port {{ wisecrow_web_port }} is already in use on {{ inventory_hostname }}
      by another process (the trading stack also runs on this host):
      {{ web_port_check.stdout | default('') | trim }}
    success_msg: "Port {{ wisecrow_web_port }} is free."
  when: (web_running.stdout | default('') | trim) != 'true'

- name: Bring the stack up
  ansible.builtin.command:
    cmd: docker compose -f {{ compose_file }} up -d
    chdir: "{{ deploy_dir }}"
  become: true
  register: compose_up
  changed_when: >-
    ('Started' in compose_up.stderr) or
    ('Created' in compose_up.stderr) or
    ('Recreated' in compose_up.stderr)

- name: Wait for postgres to report healthy
  ansible.builtin.command:
    cmd: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' wisecrow-db
  become: true
  register: pg_health
  until: pg_health.stdout.strip() == "healthy"
  retries: 30
  delay: 2
  changed_when: false

- name: Wait for wisecrow-web to report healthy
  ansible.builtin.command:
    cmd: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' wisecrow-web
  become: true
  register: web_health
  until: web_health.stdout.strip() == "healthy"
  retries: 60
  delay: 3
  changed_when: false
  failed_when: false

- name: Smoke test — wisecrow list-languages via the running container
  ansible.builtin.command:
    cmd: docker compose -f {{ compose_file }} exec -T wisecrow-web wisecrow list-languages
    chdir: "{{ deploy_dir }}"
  become: true
  register: smoke
  changed_when: false

- name: Show smoke test (first 5 lines)
  ansible.builtin.debug:
    msg: "{{ smoke.stdout_lines[:5] }}"
