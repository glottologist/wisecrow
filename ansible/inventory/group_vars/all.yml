---
# Public-facing config. Secrets live in vars/secrets.yml (vault-encrypted).

# Image tag (overridable per release).
wisecrow_image_tag: latest

# Compose file shipped to the remote and used by every lifecycle playbook.
compose_file: docker-compose.deploy.yml

# Web bind. The app terminates TLS itself (no reverse proxy), so it binds the
# public interface on the HTTPS port. Certs are mounted read-only from
# wisecrow_cert_dir into the container's /certs (see docker-compose.deploy.yml);
# the runtime user is uid 10001, so the cert files must be readable by it.
wisecrow_web_bind: "0.0.0.0"
wisecrow_web_port: 8443
wisecrow_cert_dir: "./certs"

# Runtime user inside the container (Dockerfile: useradd --uid 10001). Cert
# files must be readable by it; the renewal hook restores this ownership.
wisecrow_cert_uid: 10001

# Install a certbot deploy-hook (renewal-hooks/deploy) that copies renewed
# Let's Encrypt certs into wisecrow_cert_dir and restarts the web container so
# it reloads them. Disable for self-signed or non-certbot deployments.
wisecrow_tls_renewal_hook: true

# Obtain (and auto-renew) the Let's Encrypt cert via certbot DNS-01. calypso
# shares this host with the trading stack, whose Caddy owns :80/:443, so
# HTTP-01 / --standalone is unavailable — DNS-01 needs no inbound ports.
# IONOS DNS has no usable API on this account, so the _acme-challenge record is
# CNAME-delegated to a free deSEC zone: certbot runs --manual and a hook writes
# the TXT to deSEC over its REST API. The apt certbot's systemd timer drives
# renewals. Disable for self-signed or externally-managed certificates.
wisecrow_tls_obtain_cert: true
wisecrow_tls_domain: "wisecrow.glottologist.co.uk"   # public FQDN
wisecrow_tls_email: "jason@ridgway-taylor.co.uk"     # Let's Encrypt expiry-notice contact

# deSEC delegation zone that holds the _acme-challenge TXT. Create it free at
# desec.io, then add a one-off CNAME in IONOS:
#   _acme-challenge.wisecrow  ->  _acme-challenge.<this value>
wisecrow_desec_domain: "wisecrow.dedyn.io"

# Seconds to wait after writing the TXT to deSEC before ACME validates. deSEC
# serves the zone from ns1.desec.io and ns2.desec.org, which do not update in
# lockstep: a write was visible on ns1 after 13s but took 40s to reach ns2.
# Let's Encrypt validates from several perspectives, so a wait that only covers
# ns1 fails secondary validation with NXDOMAIN. 180s leaves ample margin.
wisecrow_desec_propagation: 180

# Default Postgres identity. Password lives in vars/secrets.yml.
postgres_user: wisecrow
postgres_db: wisecrow

# Optional knobs — leave blank to omit from the generated .env.
llm_provider: "anthropic"   # anthropic | openai
# Model id for the chosen provider. Blank = provider default
# (anthropic → claude-sonnet-5, openai → gpt-4o).
llm_model: "claude-sonnet-5"
remote_url: ""
remote_api_key: ""
sync_api_key: ""
llm_ratelimit_per_min: ""   # per-user LLM request cap; blank = default (20/min)
rust_log: "wisecrow=info,info"
