---
# Sync the latest source, rebuild the image, restart the stack.
# Usage: ansible-playbook playbooks/update.yml --ask-become-pass

- name: Update Wisecrow stack
  hosts: calypso
  vars_files: [../vars/secrets.yml]
  tasks:
    - name: Sync repository
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ deploy_dir }}/"
        delete: false
        # Without this the module builds its own `ssh -S none`, which bypasses
        # the open control master and demands a fresh signature from the
        # hardware key. The key refuses intermittently, so the deploy failed
        # here at rsync while every other task on the same host succeeded.
        use_ssh_args: true
        rsync_opts:
          - "--exclude=target"
          # The container test runner writes here (CARGO_TARGET_DIR=target-docker,
          # documented in agents/claude/), and "--exclude=target" does not cover
          # it: rsync matches whole path components. Without this the deploy
          # ships several gigabytes of build artefacts before it reaches the
          # source it exists to sync.
          - "--exclude=target-docker"
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=claude/"
          - "--exclude=codex/"
          - "--exclude=agents/"
          - "--exclude=docs/book"
          - "--exclude=.direnv"
          - "--exclude=.devenv"
          - "--exclude=.devbox"
          - "--exclude=ansible/vars/secrets.yml"

    - name: Render .env (picks up any inventory/vault changes)
      ansible.builtin.template:
        src: ../roles/wisecrow/templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
      no_log: true

    # Docker creates a missing bind-mount source as root, which the container's
    # unprivileged user then cannot write to — the exact failure this mount
    # exists to fix. Create it with the container's uid/gid instead.
    - name: Ensure the media cache directory is writable by the container user
      ansible.builtin.file:
        path: "{{ wisecrow_media_dir | default('/mnt/DATA2/wisecrow-media') }}"
        state: directory
        owner: "10001"
        group: "999"
        mode: "0755"
      become: true

    - name: Rebuild and restart
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} up -d --build
        chdir: "{{ deploy_dir }}"
      become: true
