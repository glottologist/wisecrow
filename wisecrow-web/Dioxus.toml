[application]
name = "wisecrow-web"
default_platform = "fullstack"
out_dir = "dist"
asset_dir = "assets"

[web.app]
title = "Wisecrow"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
# The stylesheet is registered via `asset!` in the root component instead: this
# key only injects a <link> tag, it does not ship the file, so the browser would
# request a stylesheet that was never bundled.
style = []
script = []

[web.resource.dev]
script = []
