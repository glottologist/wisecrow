[package]
name = "wisecrow-web"
version = "0.1.0"
edition = "2021"
description = "Dioxus fullstack web UI for Wisecrow"

[dependencies]
wisecrow-dto = { path = "../wisecrow-dto" }
dioxus = { version = "0.7", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

# Server-only dependencies, declared per-target rather than plainly optional.
# `dx bundle` applies one `--features` list to both halves of a fullstack
# build, so a server feature named on the command line also reaches the wasm
# client; confining these to non-wasm targets means the client cannot compile
# tokio, sqlx or axum however the features resolve.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls"], optional = true }
wisecrow-core = { path = "../wisecrow-core", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono"], optional = true }
dotenvy = { version = "0.15", optional = true }
config = { version = "0.14", optional = true }
tempfile = { version = "3", optional = true }
axum = { version = "0.8", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
governor = { version = "0.7", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
# Sound (TTS) and images are on by default so learn sessions get pronunciation
# and Unsplash art without remembering extra --features flags. Disable with
# `--no-default-features` if you need a minimal build.
default = ["audio", "images"]
server = ["dioxus/server", "dep:wisecrow-core", "dep:tokio", "dep:sqlx", "dep:dotenvy", "dep:config", "dep:tempfile", "dep:axum", "dep:axum-server", "dep:axum-extra", "dep:tower", "dep:tower-http", "dep:governor", "dep:rustls", "dep:rustls-pemfile"]
web = ["dioxus/web"]
# These deliberately do not imply `server`: dx enables that itself for the
# server half, and implying it here would put `dioxus/server` into the client
# build whenever the feature is named on the command line.
audio = ["wisecrow-core/tts", "dep:base64"]
images = ["wisecrow-core/images", "dep:base64", "dep:reqwest"]

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rcgen = "0.13"
rstest = "0.22"
serde_json = "1"
tempfile = "3"
