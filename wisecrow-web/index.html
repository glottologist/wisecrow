<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script>
      (() => {
        const attempt = (read) => {
          try {
            return read();
          } catch {
            return null;
          }
        };
        const saved = attempt(() => window.localStorage.getItem('wisecrow-theme'));
        const storedTheme = saved === 'light' || saved === 'dark' ? saved : null;
        const prefersDark = attempt(() =>
          window.matchMedia('(prefers-color-scheme: dark)').matches
        );
        const systemTheme = prefersDark === null ? 'dark' : prefersDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = storedTheme ?? systemTheme;
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
