name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wisecrow_test
          POSTGRES_USER: wisecrow
          POSTGRES_PASSWORD: wisecrow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wisecrow -d wisecrow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://wisecrow:wisecrow@localhost:5433/wisecrow_test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (core)
        run: cargo clippy -p wisecrow-core --all-targets -- -D warnings

      - name: Clippy (web, server feature)
        run: cargo clippy -p wisecrow-web --features server --all-targets -- -D warnings

      - name: Clippy (web, production media)
        run: cargo clippy -p wisecrow-web --features server,audio,images --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit + non-DB tests
        run: cargo nextest run --workspace

      - name: DB-backed core tests
        # Serial: these integration tests share corpus tables (some TRUNCATE them)
        # and are not isolated, so they must not run in parallel.
        run: cargo nextest run -p wisecrow-core --run-ignored ignored-only --test-threads=1

      - name: Web tests (server feature, incl. DB + TLS)
        run: cargo test -p wisecrow-web --features server -- --include-ignored

      - name: WASM client build
        run: cargo check -p wisecrow-web --features web --target wasm32-unknown-unknown
